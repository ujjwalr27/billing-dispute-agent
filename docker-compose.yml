services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Published on host 5433 (not 5432) to avoid clashing with any other
      # Postgres you may already run locally. Container-internal port stays 5432,
      # so the app connects via `db:5432` on the Compose network regardless.
      # For local `npm run dev`, connect to localhost:5433.
      - "5433:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://billing:billing@db:5432/billing?schema=public
      AGENT_PROVIDER: ${AGENT_PROVIDER:-auto}
      # Optional: set GEMINI_API_KEY in your shell or a .env file to use the
      # live model. Without it, the deterministic mock agent is used.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-3.1-flash-lite}
      # Demo data on start: if-empty (default, never wipes existing data),
      # reset (wipe + reload demos), or false.
      SEED: ${SEED:-if-empty}
    ports:
      - "3000:3000"

volumes:
  pgdata:
